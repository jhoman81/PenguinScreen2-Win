# Eternal Ring (NTSC-U retail) - PenguinScreen2 user profile, DRAFT 0.5
# Author: Joshua Homan (with Claude). Your own work; not derived from the
# shipped CC BY-NC profiles, so license it however you like.
#
# Install: copy into your user profiles folder, keeping this file name:
#   Windows: Documents\PenguinScreen2\vrprofiles\   (no hyphen; not bin\resources)
# When the game boots, the log (Documents\PenguinScreen2\logs\emulog.txt) says
#   (VR) ProfileDB: SLUS-20015 (CRC C7B9F4F7) uses the user profile <this file>
# After editing it mid-game, flip any VR setting (Stereo off and on) and look
# for "profile folder change detected - reloading": the emulator rereads the
# folder at boot and on VR setting changes, not when the file is saved.
#
# Status of each block:
#   stereo - live. `convergence` is a placeholder until `gt4cam.py qhist`
#            has seen a few minutes of play; it prints tuned numbers.
#   camera - live, works in the headset (DRAFT 0.2). Head yaw, pitch and roll
#            through the game's own camera angles (README.md, section 2).
#   screen - follows the head; flat and sized to the game's projection, which
#            the profile widens to 70 x 86 degrees (README 3); held where your
#            head was when the picture was made (lagMs; README 5a).
#
# Patches (game properties -> Patches): turn "No-Interlacing" ON (the game
# nudges every other field half a line, which shimmers on a VR screen) and
# "Widescreen 16:9" OFF (this profile sets the projection itself).

SLUS-20015:
  name: "Eternal Ring"
  crcs: [0xC7B9F4F7]
  tier: immersive
  notes: "Draft. Head look, 70x86-degree view; No-Interlacing patch on, Widescreen patch off."

  # The game's camera turns with your head, so the screen has to go with your
  # head too, or a 30-degree head turn would rotate the view twice (once in
  # the game, once in the room).
  #
  # The screen is FLAT and sized to the game's own projection, so every pixel
  # sits exactly where the game's camera ray for it points: turning your head
  # moves the whole scene across the screen at exactly head speed. (A curved
  # screen can't do that for a perspective picture: on the 64-degree curve of
  # DRAFT 0.3 the middle of the scene moved at 0.89x head speed and the edges at
  # 1.24x, a swim that grows toward the edges.)
  #
  # The profile sets the game's projection itself (the two constant writes
  # at the end of camera.writes), so the view can be taller than the game's
  # own 47 degrees, and the screen is sized to match. The picture is always
  # 640 px by 224 field lines; its half-angle tangents are 320/fx across and
  # 112/fy down, and on a 4:3 screen they must be in a 4:3 ratio. A flat
  # screen 2.0 m away then matches when height = 4 x the vertical tangent.
  #
  #   view (tall x wide)   fx      fy      screen height
  #   47 x 60 (stock size) 549.3   256.4   1.748   (exact 4:3; stock is fx 512)
  #   60 x 75              415.7   194.0   2.309
  #   70 x 86   <- used    342.8   160.0   2.801
  #   80 x 96              286.0   133.5   3.356
  #
  # Turn the Widescreen 16:9 patch OFF: these writes replace what it changes,
  # and its 16:9 would need different numbers (70 tall is then 102 wide:
  # fx 257.1, same fy and height). Change fx, fy and height together.
  #
  # lagMs: the game's picture shows your head as it was this many milliseconds
  # ago (the game runs at about 30 fps and draws a frame behind). A screen glued
  # to your head moves at once, so without this the scene slides along with
  # every head turn and then catches up, and small head movements make it
  # wobble. With it, the screen is held where your head was when the picture
  # was made, so the scene stays put in the room; the screen's edges trail your
  # head a little in fast turns instead. Needs an emulator built from the
  # windows-port branch after this change (older builds ignore the key).
  # Tune in steps of 10: scene still drags WITH your head -> raise it; scene
  # overshoots and swings back AGAINST your head -> lower it.
  screen: { follow: head, arc: 0, distance: 2.0, height: 2.801, lagMs: 60 }

  stereo:
    # Displacement per eye in NDC is  separation * max(0, 1 - convergence*Q),
    # Q = 1/w. Anything nearer than `convergence` (in the game's w units) sits
    # on the screen surface; everything farther goes into it, reaching
    # `separation` at infinity: a fraction of the screen width, so 0.010 is
    # about 52 arcmin on the 86-degree-wide screen. (The loader's comfort check
    # assumes a curved screen and skips a flat one.)
    separation: 0.010
    convergence: 100.0  # PLACEHOLDER - replace with qhist's suggestion. A guess from the
                        # scale: the eye is 150 units above the floor, and the floor at
                        # the bottom edge of the view is about 340 units away.
    uvDraws: screen     # informational in this build (UV/FST draws always stay flat)
    pinUniformQ: false  # turn on if full-screen fades or tints float in depth or double
    zDrivenDepth: false # turn on if decals or glow separate from the surfaces
                        # they sit on (multi-pass Q mismatch)

    # Menus and the ring-making screen: add a rule once a menu flag is found.
    # scenes:
    #   - { when: { address: 0x________, equals: _, width: 1 }, convergence: 16.0, label: menu }

  # ---------------------------------------------------------------------
  # Head look through the game's own camera state.
  #
  # The camera record at 0x001FF340 is the master copy:
  #   +0x00 position x, y, z, 1   (y points down; the eye is 150 above the feet)
  #   +0x10 rotation x, y, z, 1   (radians: pitch, yaw, roll)
  # Each frame the update at 0x00119FE0 copies it to the player record at
  # 0x001FF7A0 (last frame's pose), adds the look rates at 0x001FF400 to
  # pitch and yaw, clamps pitch to +/-1.0 rad, wraps yaw to +/-pi, then
  # builds the view at 0x001FF180 as RotY(pi - yaw), RotX(-pitch),
  # RotZ(roll): yaw first, then pitch about the camera's own x axis, then
  # roll about the view axis, the right order for a head pose. So all three
  # axes are plain data writes, and the game's own aim follows your head:
  # walking, attacks and spells go where you look.
  #
  # Signs, from that code: yaw grows turning right (your left turns took it
  # down), so -1. Pitch: +rx tips the view up (RotX(-rx) with y pointing
  # down), so +1. Roll: +rz turns the picture clockwise, which is what a
  # left head tilt does, so +1.
  #
  # Yaw is `delta`: each frame's head turn is added to the game's heading,
  # so the stick keeps turning you as before. Pitch and roll are `anchored`:
  # your head angle is added to whatever the game holds (normally 0), and
  # the game's value comes back when the camera disarms. Pitch is clamped to
  # the game's own +/-1.0 rad (57 degrees) so its clamp never has to fight
  # the write.
  #
  # Recenter (VR: Recenter Head Camera, or hold both thumbsticks) while
  # facing forward and level; that sets where pitch and roll are zero.
  # ---------------------------------------------------------------------
  camera:
    guards:
      # Untouched words of this build's camera update; nothing is written
      # unless they match. (This profile patches no code, so any word in the
      # update would do.)
      - { address: 0x0011AFC0, equals: 0xE4410010, width: 4 }   # swc1   $f1, 0x10($v0)   pitch += rate
      - { address: 0x0011B000, equals: 0x46000834, width: 4 }   # c.lt.s $f1, $f0         pitch clamp at +1.0
      - { address: 0x0011B770, equals: 0xC62C0018, width: 4 }   # lwc1   $f12, 0x18($s1)  roll -> RotZ

    writes:
      - { address: 0x001FF354, encoding: f32, source: head_yaw,   compose: delta,    scale: 1.0, axisSign: -1 }   # camera yaw
      - { address: 0x001FF350, encoding: f32, source: head_pitch, compose: anchored, scale: 1.0, axisSign: 1, clampMin: -1.0, clampMax: 1.0 }   # camera pitch
      - { address: 0x001FF358, encoding: f32, source: head_roll,  compose: anchored, scale: 1.0, axisSign: 1, clampMin: -0.8, clampMax: 0.8 }   # camera roll

      # The game's projection (focal lengths in pixels; 512 / 256 stock), held
      # every frame while the head camera is armed: a taller and wider view
      # (see the table at screen). The game sets it once at boot (0x00100F70),
      # and event scripts can set it (0x001BF260, fy = fx / 2); these writes
      # override a script's zoom. Comment both out for the stock view, and set
      # screen.height back to 1.748.
      - { address: 0x001FF100, encoding: f32, source: constant, bias: 342.8 }   # x focal length
      - { address: 0x001FF114, encoding: f32, source: constant, bias: 160.0 }   # y focal length (fields)
